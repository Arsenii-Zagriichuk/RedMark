# The Gale walk area (P2-01): the team's walk-area decision, read by
# prep/gale/build_pack.py, which writes sites/gale.yaml from it.
#
# Chosen on 14 Nov 2026 from Curiosity's PLACES positions and the 1 m terrain:
# the habitat sits on open, gentle ground west of Curiosity's boxwork drive,
# with off-track boxwork cells south-west of it inside the walk radius, and the
# base camp on the next gentle 100 m square. The build measures the ground at
# both and their distance from Curiosity's track each run; the figures are under
# walk_area_figures in $REDMARK_DATA/gale/crops/pack.json.
name: Gale crater boxwork
habitat: {x: 8142700, y: -285150}
base_camp: {x: 8142600, y: -285250}
# Artemis surface EVA planning: excursions up to 2 km from the lander.
walk_radius_m: 2000
# Extra ground cropped round the walk area, so slope, tiles and routes have
# neighbours at its edge.
crop_margin_m: 500

# P2-03, read by prep/gale/build_layers_2_3.py. Boxwork zones: where the ridge map is
# drawn, traced by eye on the 25 cm photo map on 14 Nov 2026 (outside them the ridge
# finder would mark layered bedrock and sand ripples too). Each is a polygon of map
# x, y. The build checks every science target against the ridge map, Curiosity's
# track, its drill sites and the walk radius, and writes them to sites/gale.yaml.
boxwork_zones:
  curiosity_boxwork:  # the network Curiosity drove through, east of the habitat
    - [8143120, -284720]
    - [8143300, -284700]
    - [8143340, -284900]
    - [8143330, -285100]
    - [8143150, -285100]
    - [8143100, -284900]
  south_west_field:  # off-track pits and ridges 450 m south-west of the habitat
    - [8142250, -285330]
    - [8142530, -285330]
    - [8142530, -285650]
    - [8142250, -285650]
# Each target is a spot the route engine reaches from base camp under the app's default
# limits (the build refuses one it cannot): most of the field's hollows are walled off
# by ground steeper than 20 degrees at the route's 4 m cells.
science_targets:
  - id: sw-ridge
    name: Boxwork ridge, south-west field
    kind: ridge  # a lit ridge between two dark pits, on a ridge pixel's centre
    x: 8142409.75
    y: -285455.25
  - id: sw-hollow
    name: Boxwork hollow, south-west field
    kind: hollow  # the floor of a 20 m cell closed in by ridges, 50 m south of that ridge
    x: 8142402.0
    y: -285504.0
