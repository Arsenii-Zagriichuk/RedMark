[project]
name = "redmark"
version = "0.1.0"
description = "RedMark: a layered Mars walk map that finds the crew's position from photos."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Only Person 2's machine installs this: `uv sync --group gpu`.
gpu = [
    "torch>=2.5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["contracts/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
