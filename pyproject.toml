[project]
name = "redmark"
version = "0.1.0"
description = "RedMark: a layered Mars walk map that finds the crew's position from photos."
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rasterio>=1.4.4",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]
# Only Person 2's machine installs this: `uv sync --group gpu`.
gpu = [
    "torch>=2.5",
]
prep = [
    "pillow>=13.0.0",
    "pyproj>=3.7.2",
    "truststore>=0.10.5",
]

[tool.uv]
package = false
default-groups = ["dev", "prep"]

[tool.pytest.ini_options]
testpaths = ["tests", "prep", "locate", "contracts/scoring"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["contracts/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
